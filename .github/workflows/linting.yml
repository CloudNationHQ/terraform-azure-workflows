name: linting

on:
  workflow_call:

permissions:
  pull-requests: read

jobs:
  check-release:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LABELS=$(gh pr view ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --json labels --jq '.labels[].name' | tr '\n' ' ')
          echo "Labels: $LABELS"
          [[ "$LABELS" == *"autorelease"* ]] && echo "skip=true" >> $GITHUB_OUTPUT || echo "skip=false" >> $GITHUB_OUTPUT

  validate-pr-title:
    name: pr commit
    needs: check-release
    if: needs.check-release.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        with:
          types: |
            fix
            feat
            chore
          ignoreLabels: |
            autorelease: pending
            autorelease: tagged
            dependencies
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  run-tflint:
    name: linting
    needs: check-release
    if: needs.check-release.outputs.skip != 'true'
    runs-on: ubuntu-latest
    env:
      TFLINT_CONFIG: ${{ github.workspace }}/called/lint/.tflint.hcl
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: cloudnationhq/terraform-azure-workflows
          path: called
          sparse-checkout: lint
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.65.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.tflint.d/plugins
          key: tflint-${{ runner.os }}-${{ hashFiles('called/lint/.tflint.hcl') }}
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - name: tflint init
        run: tflint --init --config "$TFLINT_CONFIG"
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: tflint
        run: tflint --config "$TFLINT_CONFIG" --format compact
      - name: terraform init
        run: terraform init
      - name: terraform validate
        run: terraform validate
      - name: terraform fmt
        run: terraform fmt -check -recursive

  unit-tests:
    name: unit tests
    needs: check-release
    if: needs.check-release.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - name: run terraform unit tests
        run: |
          set -euo pipefail
          shopt -s nullglob

          files=(*.tftest.hcl tests/*.tftest.hcl)

          if [ ${#files[@]} -eq 0 ]; then
            echo "no *.tftest.hcl files found, nothing to run"
            exit 0
          fi

          echo "discovered ${#files[@]} test file(s): ${files[*]}"

          log="${RUNNER_TEMP:-/tmp}/tftest.log"

          terraform init -backend=false -no-color >/dev/null
          terraform test -no-color | tee "$log"

          if ! grep -qE '^Success! [1-9][0-9]* passed' "$log"; then
            echo "::error::test files are present but no tests ran"
            exit 1
          fi

  conventions:
    name: conventions
    needs: check-release
    if: needs.check-release.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: cloudnationhq/terraform-azure-workflows
          path: called
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          check-latest: true
          cache-dependency-path: called/tests/go.sum
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: caller
      - name: select mode
        id: mode
        run: |
          repo="${GITHUB_REPOSITORY#*/}"
          if grep -qxF "$repo" called/lint/conventions-enforced.txt; then
            echo "mode=enforce" >> "$GITHUB_OUTPUT"
          else
            echo "mode=warn" >> "$GITHUB_OUTPUT"
          fi
      - name: check conventions
        working-directory: called/tests
        run: go test -v -run TestModuleConventions conventions_module_test.go
        env:
          MODULE_PATH: ${{ github.workspace }}/caller
          WAM_CONVENTIONS_MODE: ${{ steps.mode.outputs.mode }}

  tests:
    name: global tests
    needs: check-release
    if: needs.check-release.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: cloudnationhq/terraform-azure-workflows
          path: called
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          check-latest: true
          cache-dependency-path: called/tests/go.sum
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - working-directory: called/tests
        run: go mod download
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: caller
          fetch-depth: 0
      - working-directory: called/tests
        run: go test -v -run TestReadmeValidation markdown_test.go
        env:
          README_PATH: ${{ github.workspace }}/caller/README.md
