name: Add new issues to WAM project board

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  add-to-project:
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.WAM_BOT_APP_ID }}
          private-key: ${{ secrets.WAM_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Find and add recent issues to project board
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          SINCE=$(date -u -d '7 days ago' '+%Y-%m-%d')
          echo "Looking for issues created since: $SINCE"

          SEARCH_OUTPUT=$(gh api --paginate \
            "search/issues?q=org:CloudNationHQ+is:issue+is:open+created:>$SINCE&per_page=100" \
            --jq '.items[] | select(.repository_url | test("terraform-azure-|terraform-azuread-|terraform-databricks-")) | select(.repository_url | test("terraform-azure-wam") | not) | .node_id') \
            || { echo "::error::Search API call failed."; exit 1; }

          mapfile -t ALL_ISSUE_IDS <<< "$SEARCH_OUTPUT"
          [[ "${#ALL_ISSUE_IDS[@]}" -eq 1 && "${ALL_ISSUE_IDS[0]}" == "" ]] && ALL_ISSUE_IDS=()

          echo "Found ${#ALL_ISSUE_IDS[@]} issue(s) to process."

          FAILED=0
          for issue_id in "${ALL_ISSUE_IDS[@]}"; do
            echo "Adding issue $issue_id ..."
            if gh api graphql -f query='
              mutation($project: ID!, $content: ID!) {
                addProjectV2ItemById(input: {projectId: $project, contentId: $content}) {
                  item { id }
                }
              }' \
              -f project="${{ vars.WAM_PROJECT_ID }}" \
              -f content="$issue_id"; then
              echo "  -> OK"
            else
              echo "  -> FAILED (issue_id=$issue_id)"
              FAILED=$((FAILED + 1))
            fi
          done

          if [ "$FAILED" -gt 0 ]; then
            echo "::error::$FAILED mutation(s) failed. Check token permissions and project ID."
            exit 1
          fi

          echo "Done. All issues processed successfully."
