name: schema central

on:
  schedule:
    - cron: '0 0 * * 1'
  push:
    branches: [feat/central-schema-validation]
  workflow_dispatch:
    inputs:
      repositories:
        description: 'Comma-separated module repositories to validate. Leave empty to validate all modules.'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.repos.outputs.matrix }}
    steps:
      - name: Checkout workflow repo
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.WAM_BOT_APP_ID }}
          private-key: ${{ secrets.WAM_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Find module repositories
        id: repos
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          OWNER: ${{ github.repository_owner }}
          REQUESTED: ${{ inputs.repositories || (github.event_name == 'push' && 'terraform-azure-pdns,terraform-azure-vgw,terraform-azure-sql,terraform-azure-sub' || '') }}
        run: |
          if [ -n "$REQUESTED" ]; then
            REPOS=$(jq -cn --arg r "$REQUESTED" '$r | split(",") | map(gsub("^\\s+|\\s+$"; "")) | map(select(. != ""))')
          else
            REPOS=$(gh api --paginate "orgs/$OWNER/repos?per_page=100&type=all" \
              --jq '.[] | select(.archived | not) | select(.name | test("^terraform-azure(ad)?-")) | .name' \
              | while read -r repo; do
                  gh api "repos/$OWNER/$repo/contents/main.tf" --silent </dev/null 2>/dev/null && echo "$repo"
                done \
              | jq -R . | jq -sc 'sort')
          fi

          MATRIX=$(jq -c --argjson repos "$REPOS" '
            .skip as $skip | .exclusions as $ex |
            [$repos[] | select(. as $r | $skip | index($r) | not) | {
              repo: .,
              resources: ($ex[.].resources // ""),
              data_sources: ($ex[.].data_sources // ""),
              properties: ($ex[.].properties // "")
            }]' .github/schema.json)

          echo "Validating $(jq length <<< "$MATRIX") repositories"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  schema-validation:
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.matrix) }}
    name: ${{ matrix.repo }}
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.WAM_BOT_APP_ID }}
          private-key: ${{ secrets.WAM_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ matrix.repo }}
          permission-contents: read
          permission-issues: write

      - name: Checkout workflow repo
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          path: called
          persist-credentials: false

      - name: setup go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          check-latest: true
          cache-dependency-path: called/tests/go.sum

      - name: fetch go modules
        working-directory: called/tests
        run: go mod download

      - name: setup terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      - name: Checkout module repo
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: ${{ github.repository_owner }}/${{ matrix.repo }}
          token: ${{ steps.app-token.outputs.token }}
          path: caller
          persist-credentials: false

      - name: Run schema tests
        working-directory: called/tests
        run: GITHUB_REPOSITORY_NAME="$MODULE_REPO" go test -v -run TestTerraformSchemaValidation -count=1 schema_test.go
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          MODULE_REPO: ${{ matrix.repo }}
          TERRAFORM_ROOT: ${{ github.workspace }}/caller/
          EXCLUDED_RESOURCES: ${{ matrix.resources }}
          EXCLUDED_DATA_SOURCES: ${{ matrix.data_sources }}
          EXCLUDED_PROPERTIES: ${{ matrix.properties }}
