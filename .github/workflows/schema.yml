name: schema

on:
  workflow_call:
    inputs:
      exclude_resources:
        description: 'Comma-separated list of resource types to exclude'
        required: false
        type: string
        default: ''
      exclude_data_sources:
        description: 'Comma-separated list of data source types to exclude'
        required: false
        type: string
        default: ''

permissions:
  contents: read
  issues: write

jobs:
  schema-validation:
    if: github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout workflow repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cloudnationhq/terraform-azure-workflows
          path: called
          persist-credentials: false

      - name: setup go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          check-latest: true
          cache-dependency-path: called/tests/go.sum

      - name: fetch go modules
        working-directory: called/tests
        run: go mod download

      - name: setup terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      - name: Checkout target repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          path: caller
          fetch-depth: 0
          persist-credentials: false

      - name: Run schema tests
        working-directory: called/tests
        run: go test -v -run TestTerraformSchemaValidation -count=1 schema_test.go
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TERRAFORM_ROOT: ${{ github.workspace }}/caller/
          EXCLUDED_RESOURCES: ${{ inputs.exclude_resources }}
          EXCLUDED_DATA_SOURCES: ${{ inputs.exclude_data_sources }}
